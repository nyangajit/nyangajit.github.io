  b.onclick=()=>{칩=v;[...chips.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");그리기();};chips.appendChild(b);});
function 맞나(s,q){
  if(칩){ if(칩.startsWith("k:")&&s.k!==칩.slice(2))return false;
          if(칩.startsWith("m:")&&!분위기[칩.slice(2)].some(w=>s.t.includes(w)))return false;}
  if(!q)return true; q=q.toLowerCase().replace(/\s/g,"");
  return (s.c+s.t+s.e+s.g).toLowerCase().replace(/\s/g,"").includes(q);
}
function 그리기(){
  const q=$("q").value.trim(); const r=S.filter(s=>맞나(s,q));
  $("cnt").textContent=r.length+"곡";
  $("list").innerHTML=r.length?r.slice(0,300).map(s=>`<button class="song" data-c="${s.c}" data-t="${s.t.replace(/"/g,'&quot;')}"><span class="code">${s.c}</span><span><div class="t">${s.t}</div><div class="e">${s.e?s.e+" · ":""}${s.g}</div></span><span class="copy">복사</span></button>`).join(""):'<div class="empty">찾는 곡이 없어요. 다른 단어로 찾아보세요 🐾</div>';
}
function 복사(c,t){
  const txt="!신청곡 "+c;
  const done=()=>{const el=$("toast");el.textContent="「"+txt+"」 복사됐어요! 라이브 채팅에 붙여넣기 🎧";el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2600);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>{prompt("길게 눌러 복사하세요",txt);});}
  else{prompt("길게 눌러 복사하세요",txt);}
}
$("list").addEventListener("click",e=>{const b=e.target.closest(".song");if(b)복사(b.dataset.c,b.dataset.t);});
